plugins {
    id "com.android.application"
    id "kotlin-android"
    id 'com.google.gms.google-services'
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def missingReleaseSigningKeys = releaseSigningKeys.findAll { !keystoreProperties[it] }
def releaseStoreFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
def hasReleaseSigning = keystorePropertiesFile.exists() &&
        missingReleaseSigningKeys.isEmpty() &&
        releaseStoreFile != null &&
        releaseStoreFile.exists()

android {
    namespace "com.rabbit_mechanic_app.rabbit_services_app"
    compileSdkVersion 35
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11

        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.rabbit_mechanic_app.rabbit_services_app"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }
    signingConfigs {
        release {
            if (!hasReleaseSigning) {
                def reason = !keystorePropertiesFile.exists()
                        ? "Missing android/key.properties."
                        : !missingReleaseSigningKeys.isEmpty()
                        ? "Missing keys in android/key.properties: ${missingReleaseSigningKeys.join(', ')}."
                        : "Keystore file not found: ${releaseStoreFile}."
                throw new GradleException("${reason} Create android/key.properties from android/key.properties.example and point storeFile to your release/upload keystore.")
            }
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = releaseStoreFile
            storePassword = keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:30.3.2')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.android.material:material:1.11.0' 
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    
}
